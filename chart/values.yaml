replicaCount: 1

image:
  repository: grt-times
  pullPolicy: Never
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: grt-times.example.com
  path: /
  pathType: Prefix
  tls: []

env: []
  # Plain env vars — safe for non-sensitive config.
  # - name: CACHE_TTL_SECONDS
  #   value: "2"
  # - name: TRANSIT_TTC_HOST_REGEX
  #   value: "^ttc\\."
  # - name: TRANSIT_OCT_HOST_REGEX
  #   value: "^oct\\."
  # Restrict which upstream IPs uvicorn trusts for X-Forwarded-For.
  # Set to the HAProxy node/pod CIDR. Defaults to 127.0.0.1 (localhost only).
  # - name: UVICORN_FORWARDED_ALLOW_IPS
  #   value: "10.42.0.0/24"

# Mount all keys from a pre-existing Secret as env vars.
# Create the secret first:
#   kubectl create secret generic grt-times-secrets \
#     --from-literal=TRANSIT_TTC_API_KEY=xxx \
#     --from-literal=TRANSIT_OCT_API_KEY=xxx
envFrom: []
  # - secretRef:
  #     name: grt-times-secrets

resources: {}

livenessProbe:
  httpGet:
    path: /openapi.json
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /openapi.json
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}
